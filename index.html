<link rel="stylesheet" href="site.css?v=20261027130252">
<script>
  // Apply saved language and light/dark mode before first paint (no flash).
  (function () {
    try {
      var m = localStorage.getItem('bia.mode'), l = localStorage.getItem('bia.lang');
      if (!m) m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.mode = m;
      if (l) document.documentElement.lang = l;
    } catch (e) {}
  })();
</script>
